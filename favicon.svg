<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Deep space gradient background -->
    <linearGradient id="spaceGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a1128" />
      <stop offset="50%" stop-color="#101f42" />
      <stop offset="100%" stop-color="#1a0b2e" />
    </linearGradient>
    <!-- Glow effect for the star -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Rounded Background Canvas -->
  <rect width="512" height="512" rx="110" fill="url(#spaceGradient)" />

  <!-- Orbital Ring / Cosmic Dust Arc -->
  <path d="M 60 380 C 120 440, 400 360, 450 200" fill="none" stroke="#38bdf8" stroke-width="12" stroke-linecap="round" opacity="0.4" />
  <path d="M 90 350 C 140 400, 360 340, 410 220" fill="none" stroke="#818cf8" stroke-width="6" stroke-linecap="round" opacity="0.6" />

  <!-- Initials: SA (Futuristic, Clean Tech Font Style) -->
  <text x="51%" y="295" 
        font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" 
        font-weight="900" 
        font-size="190" 
        fill="#ffffff" 
        text-anchor="middle" 
        letter-spacing="2">S</text>
        
  <text x="51%" y="445" 
        font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" 
        font-weight="900" 
        font-size="190" 
        fill="#ffffff" 
        text-anchor="middle" 
        letter-spacing="2">A</text>

  <!-- Four-pointed Space Star / North Star -->
  <g transform="translate(390, 110)" filter="url(#glow)">
    <path d="M 0,-45 Q 0,0 45,0 Q 0,0 0,45 Q 0,0 -45,0 Q 0,0 0,-45 Z" fill="#38bdf8" />
    <circle cx="0" cy="0" r="10" fill="#ffffff" />
  </g>
  
  <!-- Tiny accent star -->
  <circle cx="120" cy="140" r="6" fill="#ffffff" opacity="0.8" />
  <circle cx="140" cy="100" r="3" fill="#ffffff" opacity="0.5" />
</svg>

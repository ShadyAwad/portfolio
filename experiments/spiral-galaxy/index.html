<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <title>Spiral currents · Particle study</title>
    <style>
        :root { color-scheme: dark; color: #e2f4fa; font: 16px/1.5 system-ui, sans-serif; background: #020818; }
        * { box-sizing: border-box; }
        body { margin: 0; height: 100svh; isolation: isolate; overflow: hidden;
            background: radial-gradient(ellipse at 55% 52%, #081c38, #030c20 48%, #020612 90%); }
        canvas { position: fixed; inset: 0; width: 100%; height: 100%; z-index: -1; touch-action: none; cursor: crosshair; }
        header { margin: 0; padding: clamp(1.2rem,4vw,4rem); width: fit-content; }
        h1 { margin: 0; font: 400 clamp(2.4rem,5vw,5rem)/1.02 Georgia,serif; letter-spacing: -.055em; }
        p { margin: .65em 0; font-size: .92rem; color: #a2becf; }
        footer { position: fixed; right: max(4vw,1rem); bottom: max(4vh,1rem); display: flex; gap: .5rem; }
        button { cursor: pointer; font: inherit; font-size: .84rem; padding: .55rem 1rem; color: #d3e6f2;
            border-radius: 2rem; border: 1px solid #34475d; background: #081528; }
        button[aria-pressed=true] { background: #12344a; border-color: #6aa9bd; }
        :focus-visible { outline: 2px solid #7eeaf4; outline-offset: 4px; }
    </style>
</head>
<body>
    <canvas tabindex="0" role="button" aria-label="Pulse the particle field" aria-describedby="instructions"></canvas>
    <header><h1>Spiral currents</h1><p id="instructions">Drag through the dust to stir it. Tap or press Enter to send a pulse.</p></header>
    <footer><button id="quality" type="button" aria-pressed="false">Low power</button><button id="reset" type="button">Reset field</button></footer>
    <script type="module" src="./study.js"></script>
</body>
</html>
